<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <!-- 圆头方砚：外圆取「天圆」，底座取「地方」，国风器物骨架 -->
  <rect x="14" y="14" width="92" height="92" rx="22" fill="#2b4c7c" />
  <!-- 远山：两层剪影，水墨留白意趣 -->
  <path d="M22 74 L46 46 L62 64 L78 40 L98 74 Z" fill="#faf6f0" fill-opacity="0.94" />
  <path d="M22 82 L40 62 L54 76 L70 58 L86 76 L98 82 Z" fill="#c4a35a" fill-opacity="0.9" />
  <!-- 水平线：海面/案沿 -->
  <rect x="22" y="86" width="76" height="3" rx="1.5" fill="#faf6f0" fill-opacity="0.55" />
  <!-- 玄鸟一笔，破左右对称 -->
  <path d="M74 26 c6 -5 13 -4 15 2 c2 -6 -1 -11 -7 -12 c4 -2 9 -1 11 3 c1 -5 -2 -9 -7 -10" stroke="#faf6f0" stroke-width="2.4" stroke-linecap="round" fill="none" />
</svg>
